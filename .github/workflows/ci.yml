name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            example/zerostyles-app/pnpm-lock.yaml

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install example dependencies
        run: pnpm install --frozen-lockfile
        working-directory: example/zerostyles-app

      - name: Run tests
        run: pnpm test

      - name: Run performance benchmarks
        run: pnpm bench:ci

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-results
          path: benchmark-results.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Run typecheck
        run: pnpm typecheck

      - name: Typecheck example app
        run: pnpm typecheck:example

      - name: Run build
        run: pnpm build

      - name: Validate package entry points
        run: pnpm package:check

      - name: Run lint
        run: pnpm lint

      - name: Run Prettier check
        run: pnpm format:check

  react-18-compatibility:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install React 18 compatibility versions
        run: >-
          pnpm add --save-dev --lockfile=false --ignore-scripts
          react@18.3.1 react-dom@18.3.1
          @types/react@18.3.31 @types/react-dom@18.3.7

      - name: Run tests with React 18
        run: pnpm test

      - name: Run typecheck with React 18
        run: pnpm typecheck
